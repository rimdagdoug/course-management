version: '3.8'

networks:
  spring-boot-mysql-network:
    name: spring-boot-mysql-network

volumes:
  mysql-data: {}

services:
  mysqldb:
    image: mysql:lts
    command: --mysql-native-password=ON
    ports:
      - "3308:3306"
    environment:
      - MYSQL_DATABASE=course
      - MYSQL_USER=course_user
      - MYSQL_PASSWORD=abaB7j8JcfeRKVDo2MmRmAprS6PWB7LneIpbHpMsWic=
      - MYSQL_ROOT_PASSWORD=dVLLDdGJYVIejSctGPw1qt8IjzYvIJ0ipFYjt8sSfQQ=
    networks:
      - spring-boot-mysql-network
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  techstore:
    build: .
    ports:
      - "9000:8080"
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/course
      - SPRING_DATASOURCE_USERNAME=course_user
      - SPRING_DATASOURCE_PASSWORD=abaB7j8JcfeRKVDo2MmRmAprS6PWB7LneIpbHpMsWic=
    networks:
      - spring-boot-mysql-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"  # Port pour accéder à phpMyAdmin
    environment:
      - PMA_HOST=mysqldb
      - PMA_USER=course_user
      - PMA_PASSWORD=abaB7j8JcfeRKVDo2MmRmAprS6PWB7LneIpbHpMsWic=
    networks:
      - spring-boot-mysql-network
