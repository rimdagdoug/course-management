<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Liste des Étudiants</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Course Management</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/specialities}">Spécialités</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/course}">Cours</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/students}">Étudiants</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="mb-4">Liste des Étudiants</h1>

  <a class="btn btn-primary mb-3" th:href="@{/students/add}">Ajouter un Étudiant</a>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Nom</th>
      <th>Email</th>
      <th>Numéro de Téléphone</th>
      <th>Spécialité</th> <!-- Affichage de la spécialité -->
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
      <td th:text="${student.name}"></td>
      <td th:text="${student.email}"></td>
      <td th:text="${student.phoneNumber}"></td>

      <!-- Affichage de la seule spécialité -->
      <td th:text="${student.specialities[0].speciality_name}"></td>

      <!-- Actions pour chaque étudiant -->
      <td>
        <a class="btn btn-warning btn-sm" th:href="@{/students/edit/{id}(id=${student.id})}">Éditer</a>
        <a class="btn btn-danger btn-sm" th:href="@{/students/delete/{id}(id=${student.id})}"
           onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet étudiant ?');">Supprimer</a>
        <a class="btn btn-info btn-sm" th:href="@{/students/{id}(id=${student.id})}">Détails</a>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Message de notification si nécessaire -->
  <div th:if="${#lists.isEmpty(students)}" class="alert alert-warning" role="alert">
    Aucun étudiant trouvé.
  </div>

</div>

<!-- Scripts Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>.
