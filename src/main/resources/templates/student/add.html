<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <title>Ajouter une étudiant</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Course Management</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/specialities}">Spécialités</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/course}">Cours</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/students}">Etudiant</a>
        </li>
      </ul>
    </div>
  </div>
</nav>


<div class="container mt-5">
  <h1 class="text-center">Ajouter un étudiant</h1>
  <form action="#" th:action="@{/students/add}" th:object="${student}" method="post" class="mt-4">
    <div class="form-group">
      <label for="name">Nom de la Spécialité:</label>
      <input type="text" id="name" th:field="*{name}" class="form-control" required/>
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" th:field="*{email}" class="form-control" required/>
    </div>

    <div class="form-group">
      <label for="phoneNumber">Numéro de téléphone:</label>
      <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control"/>
    </div>
    <div class="form-group">
      <label for="speciality">Spécialités:</label>
      <select id="speciality" th:field="*{specialities}" class="form-control" multiple required> <!-- Allow multiple selection -->
        <option value="" disabled>Sélectionnez une spécialité</option>
        <option th:each="speciality : ${specialities}"
                th:value="${speciality.speciality_id}"
                th:text="${speciality.speciality_name}"></option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Ajouter</button>
  </form>
  <a class="btn btn-secondary mt-3" th:href="@{/specialities}">Annuler</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
