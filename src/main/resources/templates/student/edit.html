<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Modifier Étudiant</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
  <h1 class="mb-4">Modifier Étudiant</h1>

  <form th:action="@{/students/edit/{id}(id=${student.id})}" th:object="${student}" method="post">
    <div class="form-group">
      <label for="name">Nom</label>
      <input type="text" id="name" class="form-control" th:field="*{name}" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" class="form-control" th:field="*{email}" required>
    </div>
    <div class="form-group">
      <label for="phoneNumber">Numéro de Téléphone</label>
      <input type="text" id="phoneNumber" class="form-control" th:field="*{phoneNumber}">
    </div>
    <div class="form-group">
      <label for="password">Mot de Passe</label>
      <input type="password" id="password" class="form-control" th:field="*{password}" required>
    </div>

    <!-- Specialities Selection -->
    <div class="mb-3">
      <label for="speciality">Spécialités:</label>
      <select id="speciality" th:field="*{specialities}" class="form-control"  required> <!-- Allow multiple selection -->
        <option value="" disabled>Sélectionnez une spécialité</option>
        <option th:each="speciality : ${specialities}"
                th:value="${speciality.speciality_id}"
                th:text="${speciality.speciality_name}"></option>
      </select>
      <small class="form-text text-muted">Maintenez Ctrl (ou Cmd sur Mac) pour sélectionner plusieurs spécialités.</small>
    </div>

    <button type="submit" class="btn btn-primary">Mettre à jour</button>
  </form>

  <a href="/students" class="btn btn-secondary mt-3">Retour à la liste</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
