<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Liste des Spécialités</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Gestion de cours</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/specialities/user/home}">Spécialités</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/course}">Cours</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/students}">Étudiants</a>
        </li>
      </ul>
      <ul>
        <h3 class="text-success" th:text="${#authentication.name}"></h3>
      </ul>
      <ul> <form method="post" th:action="@{/logout}">
        <button type="submit" class="btn btn-danger">Logout</button>
      </form></ul>

    </div>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="mb-4">Liste des Spécialités</h1>

  <a class="btn btn-primary mb-3" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/specialities/admin/add}">Ajouter une Spécialité</a>

  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}"></span>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>

      <th>Nom de la Spécialité</th>
      <th th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="speciality : ${specialities}">
      <td th:text="${speciality.getSpeciality_name}"></td>
      <td th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <a class="btn btn-warning btn-sm" th:href="@{/specialities/admin/edit/{id}(id=${speciality.getSpeciality_id})}">Modifier</a>
        <a class="btn btn-danger btn-sm" th:href="@{/specialities/admin/delete/{id}(id=${speciality.getSpeciality_id})}"
           onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette spécialité ?');">Supprimer</a>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Message de notification si nécessaire -->
  <div th:if="${#lists.isEmpty(specialities)}" class="alert alert-warning" role="alert">
    Aucune spécialité trouvée.
  </div>

</div>

<!-- Scripts Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
