<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <title>Ajouter une Spécialité</title>
</head>
<body>
<div class="container mt-5">
  <h1 class="text-center">Ajouter une Spécialité</h1>
  <form action="#" th:action="@{/specialities/add}" th:object="${speciality}" method="post" class="mt-4">
    <div class="form-group">
      <label for="speciality_name">Nom de la Spécialité:</label>
      <input type="text" id="speciality_name" th:field="*{speciality_name}" class="form-control" required/>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Ajouter</button>
  </form>
  <a class="btn btn-secondary mt-3" th:href="@{/specialities}">Annuler</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
