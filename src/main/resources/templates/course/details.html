<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Détails du Cours</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<div class='container mt-5'>
  <h1>Détails du Cours :
    <span th:text="${course.name}"></span></h1>

  <p><strong>Coefficient:</strong>
    <span th:text="${course.coefficient}"></span></p>

  <p><strong>Description:</strong>
    <span th:text="${course.specialty.size()}"></span></p>

  <p><strong>Spécialités:</strong>
    <span th:each="speciality, iterStat : ${course.specialty}">
        <span th:text="${speciality.getSpeciality_name}"></span>
        <span th:if="${!iterStat.last}">, </span> <!-- Ajoute une virgule si ce n'est pas le dernier -->
    </span>
  </p>

  <a href="#" th:href="@{/course/edit/{id}(id=${course.course_id})}" class='btn btn-warning'>Éditer le Cours</a>
  <a href="#" th:href="@{/course/delete/{id}(id=${course.course_id})}" onclick='return confirm("Êtes-vous sûr de vouloir supprimer ce cours ?");' class='btn btn-danger'>Supprimer le Cours</a>
  <a href="#" th:href="@{/course}" class='btn btn-secondary'>Retour à la Liste des Cours</a>
</div>

<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js'></script>

</body>
</html>
