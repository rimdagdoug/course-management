<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Liste des Cours</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Gestion de cours</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/specialities}">Spécialités</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/course}">Cours</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/students}">Étudiants</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="mb-4">Liste des Cours</h1>

  <a class="btn btn-primary mb-3" th:href="@{/course/add}">Ajouter un Cours</a>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Nom du Cours</th>
      <th>Coefficient</th>
      <th>Description</th>
      <th>Spécialités</th> <!-- Changed to plural -->
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course : ${courses}">
      <td th:text="${course.name}"></td>
      <td th:text="${course.coefficient}"></td>
      <td th:text="${course.description}"></td>

      <td>
    <span th:each="speciality, iterStat : ${course.specialities}">
        <span th:text="${speciality.getSpeciality_name}"></span>
        <span th:if="${!iterStat.last}">, </span> <!-- Ajoute une virgule si ce n'est pas le dernier -->
    </span>
      </td>
      <td>
        <a class="btn btn-warning btn-sm" th:href="@{/course/edit/{id}(id=${course.course_id})}">Éditer</a>
        <a class="btn btn-danger btn-sm" th:href="@{/course/delete/{id}(id=${course.course_id})}"
           onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce cours ?');">Supprimer</a>
        <a class="btn btn-info btn-sm" th:href="@{/course/{id}(id=${course.course_id})}">Détails</a>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Message de notification si nécessaire -->
  <div th:if="${#lists.isEmpty(courses)}" class="alert alert-warning" role="alert">
    Aucun cours trouvé.
  </div>

</div>

<!-- Scripts Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
