<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <title>Ajouter un Cours</title>
</head>
<body>
<div class="container mt-5">
  <h1 class="text-center">Ajouter un Cours</h1>
  <form action="#" th:action="@{/course/admin/add}" th:object="${course}" method="post" class="mt-4">
    <div class="form-group">
      <label for="name">Nom du Cours:</label>
      <input type="text" id="name" th:field="*{name}" class="form-control" required/>
    </div>
    <div class="form-group">
      <label for="coefficient">Coefficient:</label>
      <input type="number" id="coefficient" th:field="*{coefficient}" class="form-control"  required/>
    </div>
    <div class="form-group">
      <label for="description">Description:</label>
      <textarea id="description" th:field="*{description}" class="form-control" required></textarea>
    </div>
    <div class="form-group">
      <label for="speciality">Spécialités:</label>
      <select id="speciality" th:field="*{specialities}" class="form-control"  required> <!-- Allow multiple selection -->
        <option value="" disabled>Sélectionnez une ou plusieurs spécialités</option>
        <option th:each="speciality : ${specialities}"
                th:value="${speciality.speciality_id}"
                th:text="${speciality.speciality_name}"></option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Ajouter</button>
  </form>
  <a class="btn btn-secondary mt-3" th:href="@{/course}">Annuler</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
