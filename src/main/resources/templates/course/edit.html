<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Éditer un Cours</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
  <h1 class="text-center">Éditer le Cours</h1>

  <form th:action="@{/course/edit/{id}(id=${course.course_id})}" th:object="${course}" method="post" class="mt-4">
    <div class="mb-3">
      <label for="name" class="form-label">Nom du Cours:</label>
      <input type="text" id="name" th:field="*{name}" class="form-control" required/>
    </div>

    <div class="mb-3">
      <label for="coefficient" class="form-label">Coefficient:</label>
      <input type="number" id="coefficient" th:field="*{coefficient}" class="form-control" step="0.1" required/>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description:</label>
      <textarea id="description" th:field="*{description}" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
      <label for="specialities" class="form-label">Spécialités:</label>
      <select id="specialities" class="form-select" th:field="*{specialities}" multiple required> <!-- Allow multiple selection -->
        <option value="" disabled>Sélectionnez une ou plusieurs spécialités</option>
        <option th:each="speciality : ${specialities}"
                th:value="${speciality.specialty_id}"
                th:text="${speciality.specialty_name}"
                th:selected="${#lists.contains(course.specialities, speciality)}"></option> <!-- Check if speciality is selected -->
      </select>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Mettre à Jour</button>
  </form>

  <!-- Cancel Button -->
  <a class="btn btn-secondary mt-3" th:href="@{/course}">Annuler</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
