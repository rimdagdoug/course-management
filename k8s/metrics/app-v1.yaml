apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  namespace: course-management-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techstore
  template:
    metadata:
      labels:
        app: techstore
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
    spec:
      containers:
        - name: techstore-container
          image: rimdagdoug/course-project
          ports:
            - containerPort: 9696  # Port sur lequel l'application écoute.
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysqldb-service:3306/course"
            - name: SPRING_DATASOURCE_USERNAME
              value: "course_user"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "abaB7j8JcfeRKVDo2MmRmAprS6PWB7LneIpbHpMsWic="
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.MySQL8Dialect"  # Ajout du
          livenessProbe:
            httpGet:
              path: /live
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 5
            readinessProbe:
              httpGet:
                path: /ready
                port: probe
              periodSeconds: 5


---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: course-management-app
spec:
  type: NodePort
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
      nodePort: 30005
  selector:
    app: techstore

